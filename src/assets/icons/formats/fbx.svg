<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none">
  <title>FBX — RocketBox wireframe cube</title>
  <defs>
    <linearGradient id="edges" x1="11" y1="8" x2="53" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8FAFF"/>
      <stop offset=".46" stop-color="#5BE3FA"/>
