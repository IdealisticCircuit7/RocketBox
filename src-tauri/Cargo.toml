[package]
name = "rocket-box"
version = "1.0.0"
description = "RocketBox by OCSIS — Biblioteca desktop de assets e assistente NautIA"
authors = ["OCSIS"]
edition = "2024"

[lib]
name = "rocket_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
rfd = "0.15"
