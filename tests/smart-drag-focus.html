<!doctype html><meta charset="utf-8"><title>Smart Drag Focus — fixture isolada</title><link rel="stylesheet" href="/library.css"><style>body{background:#07111d;color:#cde5f1;font:14px system-ui;margin:20px}.controls{display:flex;gap:8px;margin-bottom:20px}button{background:#142b3c;color:inherit;border:1px solid #456273;border-radius:8px;padding:14px}#app-container{display:grid;grid-template-columns:220px 1fr;gap:22px;height:400px}aside,main{padding:16px;background:#0b1928;border:1px solid #233d50;border-radius:12px}nav{display:grid;gap:18px}.rows{display:flex;gap:20px;margin:24px 0}.rows>button{width:190px;height:110px}h2{font-size:17px}.floating-trash{width:160px;min-height:120px}.drag-shade{background:#02050c20}#result{margin-top:25px;font-size:12px}</style>
<h1>Smart Drag Focus — apenas fixtures</h1><div class="controls"><button id="start">Iniciar foco de pasta A</button><button id="cancel">Cancelar</button></div>
<div id="app-container"><aside><h2>Pastas</h2><nav><button data-drop-folder-id="a">▱ A · origem</button><button data-drop-folder-id="b">▱ B · descendente inválido</button><button data-drop-folder-id="c">▱ C · destino válido</button></nav><p>Filtros e conteúdo secundário</p></aside><main><h2>Biblioteca</h2><div class="rows"><button data-deck-type="folder" data-deck-id="a">▱ A · item arrastado</button><button data-deck-type="folder" data-deck-id="c">▱ C · destino válido</button></div><p>Asset não selecionado e informações secundárias devem ficar atenuados.</p></main></div><div class="drag-shade" aria-hidden="true"></div><div class="floating-trash" hidden><strong>▥ Lixeira</strong><span>Solte para remover o registro</span></div><pre id="result"></pre>
<script type="module">
import {applySmartDragFocus,createDragTargetCache} from '/services/smartDragFocus.ts';
const folders=[{id:'a',name:'A',parent:null},{id:'b',name:'B',parent:'a'},{id:'c',name:'C',parent:null}];let cleanup;
document.querySelector('#start').onclick=()=>{cleanup?.();document.body.classList.add('is-item-dragging');document.querySelector('.floating-trash').hidden=false;const payload={kind:'folder',folderId:'a'};cleanup=applySmartDragFocus(document.querySelector('#app-container'),payload,createDragTargetCache(payload,folders,[]));document.querySelector('#result').textContent=JSON.stringify({valid:document.querySelectorAll('.smart-focus-valid').length,muted:document.querySelectorAll('.smart-focus-muted').length,ancestorBlur:!!document.querySelector('.smart-focus-muted .smart-focus-valid')},null,2);};
const cancel=()=>{cleanup?.();cleanup=undefined;document.body.classList.remove('is-item-dragging');document.querySelector('.floating-trash').hidden=true;document.querySelector('#result').textContent='Cancelado · sem alteração de registros';};document.querySelector('#cancel').onclick=cancel;document.addEventListener('keydown',e=>{if(e.key==='Escape')cancel();});window.addEventListener('pagehide',cancel);
</script>
